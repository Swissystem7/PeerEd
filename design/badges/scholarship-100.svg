<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="title-sch100 desc-sch100">
  <title id="title-sch100">אות מלגה: 100% השלמה מלאה</title>
  <desc id="desc-sch100">השלמת מלוא שעות ההתנדבות של המלגה - הצטיינות ועמידה ביעד</desc>
  <defs>
    <linearGradient id="grad-sch100" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <filter id="shadow-sch100" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#15803D" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Gold Starburst / Laurel Base -->
  <circle cx="60" cy="60" r="54" fill="#FEF3C7" stroke="url(#gold-grad)" stroke-width="3" filter="url(#shadow-sch100)" />
  
  <!-- Complete 100% Ring -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round" />

  <!-- Inner Badge Plate -->
  <circle cx="60" cy="60" r="37" fill="url(#grad-sch100)" />

  <!-- Graduation Cap (Mortarboard) -->
  <polygon points="60,42 76,48 60,54 44,48" fill="#FEF3C7" />
  <path d="M49 51.5v6c0 3.5 5 6 11 6s11-2.5 11-6v-6" fill="none" stroke="#FEF3C7" stroke-width="2" />
  <path d="M72 49.5v8l3 3" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />

  <!-- Checkmark / Star of completion -->
  <circle cx="60" cy="69" r="6" fill="#F59E0B" />
  <path d="M57 69l2 2 4-4" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Label 100% -->
  <rect x="36" y="82" width="48" height="19" rx="9.5" fill="#064E3B" stroke="#F59E0B" stroke-width="1.5" />
  <text x="60" y="95" fill="#FEF3C7" font-family="system-ui, -apple-system, Rubik, sans-serif" font-size="11" font-weight="900" text-anchor="middle">100% מושלם</text>

  <!-- Laurel accents -->
  <path d="M22 60c0-10 6-19 14-23M98 60c0-10-6-19-14-23" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
</svg>
