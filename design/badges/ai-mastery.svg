<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="title-aimast desc-aimast">
  <title id="title-aimast">אות הצטיינות: התאמת AI מושלמת</title>
  <desc id="desc-aimast">התאמה של 100% בנושאי בינה מלאכותית, אוריינות, יצירתיות, קוד ואתיקה</desc>
  <defs>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="shadow-ai" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Hexagonal Tech Shield Base -->
  <polygon points="60,10 102,34 102,86 60,110 18,86 18,34" fill="#0F172A" stroke="url(#neon-cyan)" stroke-width="3" filter="url(#shadow-ai)" />
  
  <!-- Inner Circuit Glow Ring -->
  <circle cx="60" cy="58" r="32" fill="url(#ai-glow)" opacity="0.9" />

  <!-- Neural Network Nodes & Constellation -->
  <line x1="60" y1="40" x2="44" y2="52" stroke="#A5F3FC" stroke-width="1.8" />
  <line x1="60" y1="40" x2="76" y2="52" stroke="#A5F3FC" stroke-width="1.8" />
  <line x1="44" y1="52" x2="50" y2="70" stroke="#A5F3FC" stroke-width="1.8" />
  <line x1="76" y1="52" x2="70" y2="70" stroke="#A5F3FC" stroke-width="1.8" />
  <line x1="50" y1="70" x2="70" y2="70" stroke="#A5F3FC" stroke-width="1.8" />
  <line x1="60" y1="40" x2="60" y2="60" stroke="#FFFFFF" stroke-width="2" />
  <line x1="44" y1="52" x2="60" y2="60" stroke="#FFFFFF" stroke-width="2" />
  <line x1="76" y1="52" x2="60" y2="60" stroke="#FFFFFF" stroke-width="2" />
  <line x1="50" y1="70" x2="60" y2="60" stroke="#FFFFFF" stroke-width="2" />
  <line x1="70" y1="70" x2="60" y2="60" stroke="#FFFFFF" stroke-width="2" />

  <!-- Node Dots -->
  <circle cx="60" cy="40" r="3.5" fill="#FFFFFF" />
  <circle cx="44" cy="52" r="3" fill="#67E8F9" />
  <circle cx="76" cy="52" r="3" fill="#67E8F9" />
  <circle cx="50" cy="70" r="3" fill="#E879F9" />
  <circle cx="70" cy="70" r="3" fill="#E879F9" />
  <circle cx="60" cy="60" r="4.5" fill="#F43F5E" />

  <!-- Label AI 100% -->
  <rect x="34" y="80" width="52" height="18" rx="9" fill="#1E1B4B" stroke="#22D3EE" stroke-width="1.2" />
  <text x="60" y="93" fill="#67E8F9" font-family="system-ui, -apple-system, Rubik, sans-serif" font-size="10" font-weight="900" text-anchor="middle">AI FIT 100%</text>

  <!-- Sparkles -->
  <polygon points="60,20 62,24 66,26 62,28 60,32 58,28 54,26 58,24" fill="#38BDF8" />
</svg>
