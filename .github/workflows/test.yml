name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, factory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      # no lockfile and no dependencies: nothing to install
      - run: npm test
      - run: node scripts/build-app.js --check
