name: local-ai-agent
on:
  workflow_dispatch:
    inputs:
      task: {description: Small coding task, required: true, type: string}
  issues: {types: [labeled]}
  issue_comment: {types: [created]}
permissions: {contents: write, pull-requests: write, issues: read}
concurrency: {group: "local-ai-agent-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}", cancel-in-progress: false}
jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.label.name == 'ai') || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && (contains(github.event.comment.body, '/qwen') || contains(github.event.comment.body, '/aider')))
    runs-on: [self-hosted, factory]
    timeout-minutes: 90
    env: {OLLAMA_HOST: http://127.0.0.1:11434, OPENAI_API_BASE: http://127.0.0.1:11434/v1, OPENAI_API_KEY: local-only, NO_COLOR: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Resolve task
        env: {INPUT_TASK: '${{ inputs.task }}', ISSUE_TITLE: '${{ github.event.issue.title }}', ISSUE_BODY: '${{ github.event.issue.body }}', COMMENT_BODY: '${{ github.event.comment.body }}', ISSUE_NUMBER: '${{ github.event.issue.number }}'}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          task=os.environ.get('INPUT_TASK','').strip(); title=os.environ.get('ISSUE_TITLE','').strip(); body=os.environ.get('ISSUE_BODY','').strip(); comment=os.environ.get('COMMENT_BODY','').strip(); num=os.environ.get('ISSUE_NUMBER','').strip()
          if not task and title: task=f'Work on issue #{num}: {title}\n\n{body}'
          if comment: task=(task+'\n\nRequested command/comment:\n'+comment).strip()
          if not task: raise SystemExit('No task text supplied')
          Path('/tmp/local-ai-agent-task.md').write_text(task+'\n')
          PY
      - name: Create branch
        run: |
          git switch -c "ai-agent/${GITHUB_RUN_ID}"; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; echo "AI_AGENT_BRANCH=ai-agent/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Run local Qwen through Aider
        run: |
          command -v aider >/dev/null 2>&1 || python3 -m pip install --user --disable-pip-version-check --quiet aider-chat
          export PATH="$HOME/.local/bin:$PATH"; case "$(hostname)" in *lenovo*) model=qwen3-coder:30b;; *) model=qwen3:14b;; esac; aider --model "openai/$model" --yes-always --no-auto-commits --no-pretty --message-file /tmp/local-ai-agent-task.md
      - name: Run tests
        run: 'if [ -f package.json ]; then npm test; elif [ -f pyproject.toml ]; then python3 -m pytest -q; else git diff --check; fi'
      - name: Commit and open draft PR
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git add -A
          while IFS= read -r -d '' path; do
            [ -f "$path" ] || continue
            nums="$(git diff --cached --numstat -- "$path" | awk '{print $1, $2}')"
            [ "$nums" = "- -" ] && continue
            sed -i 's/[[:blank:]]*$//' "$path"
          done < <(git diff --cached --name-only -z --diff-filter=ACM)
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m 'ai: apply local Qwen task'
          git push --set-upstream origin "$AI_AGENT_BRANCH"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$AI_AGENT_BRANCH" \
            --base master \
            --draft \
            --title "ai: local Qwen task" \
            --body $'Draft PR from private local Qwen/Aider lane; tests ran on a factory runner.'
